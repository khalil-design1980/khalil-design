<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Khalil Design</title>
<meta name="description" content="خليل ديزاين: تصميم جرافيك وفيديو بالذكاء الاصطناعي">
<link rel="icon" href="/media/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/media/logo.png">
<link rel="preload" href="/fonts/thmanyah-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/thmanyah-bold.woff2" as="font" type="font/woff2" crossorigin>
<meta property="og:title" content="Khalil Design | خليل ديزاين">
<meta property="og:description" content="تصميم جرافيك وفيديو بالذكاء الاصطناعي">
<meta property="og:image" content="/media/takamul-1.webp">
<meta name="theme-color" content="#F5F1E8">
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style id="site-style">@font-face{font-family:"Thmanyah";src:url("/fonts/thmanyah-light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Thmanyah";src:url("/fonts/thmanyah-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Thmanyah";src:url("/fonts/thmanyah-medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Thmanyah";src:url("/fonts/thmanyah-bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
/* Layout: warm paper field; asymmetric RTL hero, filterable works wall, cinematic reel band, quiet editorial sections. */
:root{
  --ink:#F5F1E8;         /* warm cream, page ground */
  --navy:#FBF9F6;        /* raised surfaces */
  --navy-2:#E6D3B3;      /* pale gold, borders */
  --steel:#9FB0A8;       /* sage grey, details */
  --teal:#034434;        /* deep olive green, the accent */
  --teal-hi:#E3A95D;     /* warm gold, the highlight */
  --green-hi:#0B5C47;    /* lighter green */
  --fg:#1F2A26;
  --muted:#5D6A64;
  --line:rgba(3,68,52,.16);
  --f-display:"Thmanyah",system-ui,sans-serif;
  --f-body:"Thmanyah",system-ui,sans-serif;
  --f-latin:"Thmanyah",system-ui,sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --wrap:1200px;
  --sand:#E6D3B3;--stone:#E9E7E1;--soft:#46524D;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
::selection{background:var(--teal-hi);color:var(--teal)}
.site{direction:rtl}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:var(--gut);padding-right:var(--gut-r)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.eyebrow{font-family:var(--f-latin);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--teal-hi)}
.sec{padding-block:clamp(72px,10vw,128px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.sec-head h2{font-size:clamp(30px,4.4vw,52px);font-weight:700;margin-top:12px}
.sec-head p{color:var(--muted);max-width:42ch}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(245,241,232,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:38px;height:auto}
.wordmark{font-family:var(--f-latin);font-weight:600;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.wordmark b{font-weight:600;color:var(--teal)}
.nav{display:flex;gap:6px;align-items:center}
.nav a{text-decoration:none;font-size:15px;color:var(--muted);padding:8px 14px;border-radius:999px;transition:color .2s,background .2s}
.nav a:hover{color:var(--fg);background:rgba(3,68,52,.07)}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:500;font-size:15px;text-decoration:none;border:0;cursor:pointer;padding:13px 22px;border-radius:999px;transition:transform .25s,box-shadow .25s,background .25s}
.btn-primary{background:linear-gradient(135deg,var(--teal-hi),var(--teal) 55%,var(--green-hi));color:var(--ink);box-shadow:0 8px 30px -10px rgba(3,68,52,.7)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px -10px rgba(3,68,52,.85)}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--navy-2)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--teal);color:var(--teal)}
.btn svg{width:18px;height:18px}
.menu-btn{display:none;background:none;border:1px solid var(--navy-2);color:var(--fg);width:44px;height:44px;border-radius:12px;cursor:pointer}
@media (max-width:860px){
  .nav{display:none;position:absolute;top:72px;inset-inline:0;flex-direction:column;align-items:stretch;background:var(--ink);border-bottom:1px solid var(--line);padding:12px var(--gut-r) 20px var(--gut)}
  .nav.open{display:flex}
  .nav a{padding:14px;font-size:17px}
  .menu-btn{display:grid;place-items:center}
  .hdr .btn-primary{display:none}
}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#facets{display:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(245,241,232,.96) 0%,rgba(245,241,232,.78) 45%,rgba(245,241,232,.2) 100%),linear-gradient(0deg,var(--ink),transparent 30%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:clamp(80px,13vw,160px) clamp(64px,9vw,110px)}
.hero h1{font-size:clamp(30px,4.4vw,58px);font-weight:800;letter-spacing:-.01em;max-width:18ch;line-height:1.3}
.hero h1 .grad{color:#B5772A}
.hero .lede{margin-top:26px;font-size:clamp(17px,1.6vw,20px);color:var(--soft);max-width:46ch}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:38px}
.hero-meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:64px;color:var(--muted);font-size:14px}
.hero-meta span{display:flex;align-items:center;gap:8px}
/* hero: copy on the start side; the intro video fills the end side from header to ticker */
.hero-copy{max-width:min(640px,50%)}
.hero-film{position:absolute;z-index:2;top:50%;transform:translateY(-50%);inset-inline-end:max(20px,env(safe-area-inset-left,0px));aspect-ratio:var(--ar,1.13);height:min(calc(100% - 32px),calc((46vw - 20px) / var(--ar,1.13)));margin:0;border-radius:24px;overflow:hidden;background:var(--teal);box-shadow:0 0 0 1px rgba(227,169,93,.45),0 40px 90px -40px rgba(3,68,52,.55)}
.hero-film video{width:100%;height:100%;object-fit:cover;display:block}
.hero-film button{font:inherit;cursor:pointer;position:absolute;inset-inline-start:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#F5F1E8;background:rgba(3,68,52,.72);backdrop-filter:blur(6px);border:1px solid rgba(227,169,93,.5);border-radius:999px;padding:8px 15px}
.hero-film button svg{width:12px;height:12px;transform:scaleX(-1)}
.hero-film button:hover{background:var(--teal)}
.hero:has(> .hero-film[hidden]) .hero-copy{max-width:none}
@media (max-width:900px){
  .hero{display:flex;flex-direction:column}
  .hero-copy{max-width:none}
  .hero-film{position:relative;order:2;inset:auto;transform:none;height:auto;width:auto;margin:0 var(--gut-r) 28px var(--gut);aspect-ratio:var(--ar,1.13)}
}
.hero-meta i{width:8px;height:8px;transform:rotate(45deg);background:var(--teal);display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .hero h1,.hero .lede,.hero .ctas,.hero-meta{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .hero .lede{animation-delay:.12s}.hero .ctas{animation-delay:.22s}.hero-meta{animation-delay:.32s}
}
@keyframes rise{from{transform:translateY(22px);opacity:.25}to{transform:none;opacity:1}}

/* marquee */
.ticker{border-bottom:1px solid var(--line);overflow:hidden;padding-block:18px;direction:ltr}
.ticker-track{display:flex;gap:48px;width:max-content;font-family:var(--f-latin);font-weight:600;letter-spacing:.18em;font-size:13px;color:var(--muted);text-transform:uppercase}
.ticker-track span{display:flex;align-items:center;gap:48px;white-space:nowrap}
.ticker-track span::after{content:"";width:7px;height:7px;background:var(--teal-hi);transform:rotate(45deg)}
@media (prefers-reduced-motion:no-preference){.ticker-track{animation:tick 38s linear infinite}}
@keyframes tick{to{transform:translateX(-50%)}}

/* services */
.services{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.svc{background:var(--ink);padding:30px 26px 34px;display:flex;flex-direction:column;gap:14px;transition:background .3s}
.svc:hover{background:var(--navy)}
.svc svg{width:44px;height:44px}
.svc h3{font-size:20px;font-weight:700}
.svc p{color:var(--muted);font-size:15px}
.svc .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.tag{font-size:12px;color:var(--teal-hi);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--f-body)}
@media (max-width:980px){.services{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.services{grid-template-columns:1fr}}

/* works */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font-family:var(--f-display);font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--navy-2);border-radius:999px;padding:9px 18px;cursor:pointer;transition:all .2s;display:flex;gap:8px;align-items:center}
.filters button small{font-family:var(--f-latin);font-size:11px;opacity:.7}
.filters button:hover{color:var(--fg);border-color:var(--teal)}
.filters button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:34px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{position:relative;display:flex;flex-direction:column;gap:14px;text-align:start;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.card[hidden]{display:none}
.thumb{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:18px;overflow:hidden;background:var(--navy);isolation:isolate}
.thumb canvas,.thumb video,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb canvas,.card:hover .thumb video,.card:hover .thumb img.main,.card:focus-visible .thumb canvas{transform:scale(1.045)}
.thumb img.blur{filter:blur(28px) brightness(.75) saturate(1.2);transform:scale(1.25)}
.thumb img.main{object-fit:contain}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(3,68,52,.10);pointer-events:none}
.badge{position:absolute;top:14px;inset-inline-start:14px;z-index:2;font-size:12px;background:rgba(251,249,246,.7);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:4px 12px;display:flex;gap:6px;align-items:center}
.badge.vid{color:var(--teal)}
.play-dot{position:absolute;z-index:2;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(251,249,246,.55);backdrop-filter:blur(6px);border:1px solid rgba(3,68,52,.3);display:grid;place-items:center;transition:transform .3s,background .3s}
.play-dot svg{width:22px;height:22px;margin-inline-start:-3px;transform:scaleX(-1)}
.card:hover .play-dot{transform:scale(1.1);background:var(--teal)}
.card:hover .play-dot svg path{fill:var(--ink)}
.card-info{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card-info h3{font-size:18px;font-weight:500}
.card-info span{font-size:13px;color:var(--muted);white-space:nowrap}
.demo-note{margin-top:28px;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
.demo-note::before{content:"";width:8px;height:8px;border-radius:50%;background:#B57A2C;flex:none}

/* reel */
.reel-band{background:radial-gradient(120% 80% at 80% 0%,rgba(230,211,179,.45),transparent 60%),var(--navy);border-block:1px solid var(--line)}
.player{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:#000;box-shadow:0 40px 120px -40px rgba(3,68,52,.35)}
.player video{width:100%;height:100%;object-fit:cover;display:block}
.player.fit{aspect-ratio:var(--ar,16/9);width:min(100%,calc(82vh * var(--ar,1.7778)));margin-inline:auto}
.player.fit video{object-fit:contain}
.player.tall .reel-title h3{font-size:clamp(18px,2vw,24px)}
.player .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,3vw,34px);background:linear-gradient(0deg,rgba(251,249,246,.85),transparent 45%,rgba(251,249,246,.35));transition:opacity .4s}
.player.playing .overlay{opacity:0}
.player.playing:hover .overlay,.player.playing:focus-within .overlay{opacity:1}
.player .big-play{align-self:center;margin-block:auto;width:clamp(72px,9vw,104px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--teal-hi),var(--teal));display:grid;place-items:center;box-shadow:0 0 0 12px rgba(3,68,52,.15),0 0 0 26px rgba(3,68,52,.07);transition:transform .3s}
.player .big-play:hover{transform:scale(1.06)}
.player .big-play svg{width:34%;height:34%;transform:scaleX(-1);margin-inline-start:-6%}
.player.playing .big-play{display:none}
.player.empty{background:radial-gradient(70% 90% at 30% 20%,rgba(230,211,179,.7),transparent 60%),radial-gradient(60% 80% at 85% 90%,rgba(227,169,93,.35),transparent 60%),var(--ink)}
.player.empty .big-play,.player.empty .controls{display:none}
.player.empty .overlay{justify-content:center;align-items:center;text-align:center;background:none}
.player.empty .reel-title{justify-content:center}
.player.empty .reel-title h3{font-size:clamp(24px,3.4vw,40px)}
.reel-title{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end}
.reel-title h3{font-size:clamp(20px,2.6vw,32px);font-weight:700}
.reel-title p{color:var(--muted);font-size:14px}
.controls{display:flex;align-items:center;gap:14px;direction:ltr}
.controls button{background:rgba(251,249,246,.6);border:1px solid var(--line);color:var(--fg);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.controls button svg{width:16px;height:16px}
.bar{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:4px;cursor:pointer;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-hi));border-radius:4px}
.time{font-family:var(--f-latin);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:84px;text-align:right}
.reel-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.reel-list button{display:flex;gap:14px;align-items:center;text-align:start;background:rgba(251,249,246,.5);border:1px solid var(--line);border-radius:16px;padding:10px;color:inherit;font:inherit;cursor:pointer;transition:border-color .2s}
.reel-list button[aria-current="true"],.reel-list button:hover{border-color:var(--teal)}
.reel-list img,.reel-list video{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none;background:#000}
.reel-list b{display:block;font-weight:500;font-size:15px;font-family:var(--f-display)}
.reel-list small{color:var(--muted);font-size:12px}
@media (max-width:820px){.reel-list{grid-template-columns:1fr}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;counter-reset:s}
.step{position:relative;padding-top:56px;border-top:1px solid var(--navy-2)}
.step::before{counter-increment:s;content:"0" counter(s);position:absolute;top:16px;inset-inline-start:0;font-family:var(--f-latin);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--teal)}
.step::after{content:"";position:absolute;top:-5px;inset-inline-start:0;width:9px;height:9px;background:var(--teal);transform:rotate(45deg)}
.step h3{font-size:20px;font-weight:700;margin-bottom:10px}
.step p{color:var(--muted);font-size:15px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,80px);align-items:center}
.portrait{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:28px;overflow:hidden;background:var(--navy)}
.portrait canvas{width:100%;height:100%;display:block}
.portrait img{position:absolute;inset:auto 0 0 0;width:100%;height:94%;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.portrait::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(0deg,rgba(251,249,246,.9),transparent);pointer-events:none}
.portrait .ph{position:absolute;inset-inline:18px;bottom:18px;font-size:13px;color:var(--muted);background:rgba(251,249,246,.7);border:1px dashed var(--navy-2);border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px)}
.about h2{font-size:clamp(30px,4.4vw,52px);font-weight:700;margin:12px 0 22px}
.about p{color:var(--soft);font-size:17px;max-width:58ch}
.about p + p{margin-top:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.tools span{font-family:var(--f-latin);font-size:13px;font-weight:500;border:1px solid var(--navy-2);border-radius:10px;padding:7px 13px;color:var(--fg);background:var(--navy)}
@media (max-width:860px){.about{grid-template-columns:1fr}.portrait{max-width:420px}}

/* contact */
.contact{position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,#EEE7DD,#E7DDD0 50%,#DED1C2);border:1px solid var(--line);padding:clamp(28px,5vw,64px)}
.contact::before{content:"";position:absolute;width:520px;height:520px;inset-inline-start:-160px;top:-200px;background:radial-gradient(circle,rgba(230,211,179,.7),transparent 65%);pointer-events:none}
.contact-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px)}
.contact h2{font-size:clamp(32px,5vw,60px);font-weight:800;margin:12px 0 18px}
.contact .sub{color:var(--soft);max-width:40ch}
.channels{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.ch{display:flex;align-items:center;gap:14px;background:rgba(251,249,246,.45);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ch svg{width:22px;height:22px;flex:none;color:var(--teal)}
.ch div{flex:1;min-width:0}
.ch small{display:block;color:var(--muted);font-size:12px}
.ch b{font-weight:500;font-family:var(--f-latin);direction:ltr;display:block;text-align:right;overflow-wrap:anywhere;user-select:all}
.ch button{background:none;border:1px solid var(--navy-2);color:var(--muted);border-radius:8px;font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
.ch button:hover{color:var(--fg);border-color:var(--teal)}
form.brief{display:flex;flex-direction:column;gap:14px;background:rgba(251,249,246,.5);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,30px)}
form.brief h3{font-size:20px;font-weight:700}
form.brief p{color:var(--muted);font-size:14px;margin-top:-6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--fg);background:var(--ink);border:1px solid var(--navy-2);border-radius:12px;padding:12px 14px;width:100%;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal)}

<script id="app">(()=>{
const $=s=>document.querySelector(s);
{const t=document.getElementById('tpl');t.before(t.content.cloneNode(true))}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.documentElement.lang='ar';

const HEADBITS="<title>Khalil Design</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<meta name=\"description\" content=\"خليل ديزاين: تصميم جرافيك وفيديو بالذكاء الاصطناعي\">\n";
let DATA=JSON.parse(document.getElementById('site-data').textContent);
if(!DATA.quotes)DATA.quotes=[];

/* ---------- utilities ---------- */
function rng(seed){let t=0;for(const c of String(seed))t=(t*31+c.charCodeAt(0))|0;return()=>{t|=0;t=t+0x6D2B79F5|0;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function fit(cv){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));return[cv.getContext('2d'),cv.width,cv.height,d]}
function tri(ctx,w,h,rnd,cell){
  const nx=Math.ceil(w/cell)+1,ny=Math.ceil(h/cell)+1,P=[];
  for(let y=0;y<=ny;y++)for(let x=0;x<=nx;x++)P.push([(x+(rnd()-.5)*.8)*cell,(y+(rnd()-.5)*.8)*cell]);
  const T=[];
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const a=y*(nx+1)+x,b=a+1,c=a+nx+1,d=c+1;if(rnd()>.5){T.push([a,b,d],[a,d,c])}else{T.push([a,b,c],[b,d,c])}}
  return{P,T};
}

/* ---------- hero facets ---------- */
const hero=$('#facets');let mesh,hctx,HW,HH,mx=.25,my=.3,tmx=.25,tmy=.3;
const N1=hex('#F5F1E8'),N2=hex('#E4DACE'),T1=hex('#CDBBA8'),T2=hex('#B7A391');
function heroInit(){[hctx,HW,HH]=fit(hero);const r=rng('hero');mesh=tri(hctx,HW,HH,r,Math.max(70,HW/16));mesh.s=mesh.T.map(()=>r())}
function heroDraw(t){
  const{P,T,s}=mesh;hctx.clearRect(0,0,HW,HH);
  const lx=mx*HW,ly=my*HH,R=Math.max(HW,HH)*.55;
  for(let i=0;i<T.length;i++){
    const[a,b,c]=T[i].map(k=>P[k]),cx=(a[0]+b[0]+c[0])/3,cy=(a[1]+b[1]+c[1])/3;
    const d=Math.hypot(cx-lx,cy-ly)/R,glow=Math.max(0,1-d);
    const shimmer=.5+.5*Math.sin(t*.0006+s[i]*6.28);
    let col=mix(N1,N2,.25+s[i]*.5);
    col=mix(col,mix(T1,T2,shimmer*.5),glow*glow*(.55+s[i]*.35));
    hctx.fillStyle=rgb(col);hctx.beginPath();hctx.moveTo(...a);hctx.lineTo(...b);hctx.lineTo(...c);hctx.closePath();hctx.fill();
    hctx.strokeStyle=rgb(T1,.05+glow*.12);hctx.lineWidth=1;hctx.stroke();
  }
}
function heroLoop(t){mx+=(tmx-mx)*.04;my+=(tmy-my)*.04;if(!reduce){tmx=.22+.08*Math.sin(t*.00025)+(px-.5)*.25;tmy=.35+.1*Math.cos(t*.0003)+(py-.5)*.25}heroDraw(t);if(!reduce&&heroVisible)requestAnimationFrame(heroLoop)}
let px=.5,py=.5,heroVisible=true;
addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight},{passive:true});
new IntersectionObserver(([e])=>{const was=heroVisible;heroVisible=e.isIntersecting;if(heroVisible&&!was&&!reduce)requestAnimationFrame(heroLoop)}).observe(hero);

/* ---------- ticker ---------- */
const words=['Brand Identity','Social Media','AI Video','Motion','Posters','Packaging','Art Direction','Midjourney','Runway'];
$('#ticker').innerHTML=[...words,...words].map(w=>`<span>${w}</span>`).join('');

/* ---------- generative thumbnails ---------- */
function bg(ctx,w,h,a,b){const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function bigWord(ctx,w,h,word,color,size=.34,y=.5){ctx.save();ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=`800 ${Math.round(w*size)}px Thmanyah, sans-serif`;ctx.fillText(word,w/2,h*y);ctx.restore()}
function label(ctx,w,h,txt,color){ctx.save();ctx.font=`600 ${Math.round(w*.032)}px Thmanyah, sans-serif`;ctx.fillStyle=color;ctx.letterSpacing=`${Math.round(w*.006)}px`;ctx.textAlign='left';ctx.fillText(txt,w*.07,h*.93);ctx.textAlign='right';ctx.fillText('KHALIL DESIGN',w*.93,h*.93);ctx.restore()}
const ART={
 identity(ctx,w,h,r,[a,b,c],word){
  bg(ctx,w,h,a,rgb(mix(hex(a),hex(b),.12)));
  ctx.fillStyle=b;ctx.beginPath();ctx.arc(w/2,h*.42,w*.27,0,7);ctx.fill();
  ctx.strokeStyle=c;ctx.lineWidth=w*.008;ctx.beginPath();ctx.arc(w/2,h*.42,w*.32,0,7);ctx.stroke();
  bigWord(ctx,w,h,word,a,.2,.43);
  [a,b,c].forEach((col,i)=>{ctx.fillStyle=col;ctx.strokeStyle=rgb(hex(c),.4);ctx.lineWidth=2;ctx.beginPath();ctx.arc(w*(.36+i*.14),h*.78,w*.045,0,7);ctx.fill();ctx.stroke()});
  label(ctx,w,h,'BRAND IDENTITY',rgb(hex(c),.6));
 },
 orbs(ctx,w,h,r,[a,b,c],word){
  bg(ctx,w,h,a,rgb(mix(hex(a),[0,0,0],.4)));
  for(let i=0;i<5;i++){const x=r()*w,y=r()*h*.8,R=w*(.25+r()*.35),g=ctx.createRadialGradient(x,y,0,x,y,R),col=hex(i%2?b:c);g.addColorStop(0,rgb(col,.55));g.addColorStop(1,rgb(col,0));ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
  ctx.strokeStyle=rgb(hex(b),.8);ctx.lineWidth=w*.006;ctx.beginPath();ctx.arc(w*.5,h*.4,w*.16,Math.PI*.3,Math.PI*1.7);ctx.stroke();
  bigWord(ctx,w,h,word,'#fff',.2,.68);
  label(ctx,w,h,'SOCIAL CAMPAIGN',rgb(hex(b),.8));
 },
 facets(ctx,w,h,r,[a,b,c],word){
  bg(ctx,w,h,c,c);const{P,T}=tri(ctx,w,h,r,w/6);const A=hex(a),B=hex(b),C=hex(c);
  T.forEach(t=>{const p=t.map(k=>P[k]),cy=(p[0][1]+p[1][1]+p[2][1])/3/h;const col=cy<.6?mix(B,A,cy/.6+r()*.15):mix(A,C,(cy-.6)/.4+r()*.2);ctx.fillStyle=rgb(col.map(v=>Math.min(255,Math.max(0,v))));ctx.beginPath();ctx.moveTo(...p[0]);ctx.lineTo(...p[1]);ctx.lineTo(...p[2]);ctx.fill()});
  ctx.fillStyle=rgb(C,.85);ctx.fillRect(0,h*.62,w,h*.38);
  bigWord(ctx,w,h,word,b,.3,.77);
  label(ctx,w,h,'SUMMER FEST · 2025',rgb(hex(b),.7));
 },
 lines(ctx,w,h,r,[a,b,c],word){
  bg(ctx,w,h,a,rgb(mix(hex(a),[0,0,0],.35)));
  for(let i=0;i<18;i++){ctx.strokeStyle=rgb(hex(b),.08+i*.04);ctx.lineWidth=w*.004;ctx.beginPath();ctx.arc(w/2,h*.62,w*(.06+i*.035),Math.PI,0);ctx.stroke()}
  ctx.fillStyle=a;ctx.fillRect(0,h*.62,w,h);ctx.fillStyle=b;ctx.fillRect(w*.15,h*.62,w*.7,w*.006);
  bigWord(ctx,w,h,word,c,.17,.76);

async function prepImage(file){
 if(file.type==='image/gif')return file;
 try{const bmp=await createImageBitmap(file),s=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  if(s===1&&file.size<1.5e6)return file;
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(b=>r(b&&b.size<file.size?b:file),'image/webp',.86))}catch(_){return file}
}
function grabPoster(file){return new Promise(res=>{let done=false;const v=document.createElement('video'),u=URL.createObjectURL(file);
 const fin=b=>{if(done)return;done=true;URL.revokeObjectURL(u);res(b)};
 v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
 v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)/4)};
 v.onseeked=()=>{try{const s=Math.min(1,1280/v.videoWidth),cv=document.createElement('canvas');cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);cv.toBlob(b=>fin(b),'image/jpeg',.82)}catch(_){fin(null)}};
 v.onerror=()=>fin(null);setTimeout(()=>fin(null),15000)})}

async function uploadMedia(file,videoOnly){
 const isV=file.type.startsWith('video/');
 if(videoOnly&&!isV)throw{msg:'اختار ملف فيديو MP4.'};
 if(isV&&!/^video\/(mp4|webm)$/.test(file.type))throw{msg:'صيغة الفيديو لازم تكون MP4. إذا الفيديو MOV، صدّره MP4.'};
 if(!isV&&!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw{msg:'صيغة الصورة لازم تكون JPG أو PNG أو WEBP.'};
 if(isV&&file.size>20*1048576)throw{msg:`حجم الفيديو ${MB(file.size)} ميغا، والحد 20 ميغا. اضغطه بـ HandBrake وجرب.`};
 if(isV){const p=await grabPoster(file);const video=await upload(file,file.type);let poster=null;if(p){try{poster=await upload(p,'image/jpeg')}catch(_){}}return{video,poster}}

}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

 const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const n=enc.encode(f.name),c=crc32(f.data),s=f.data.length;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,s,true);h.setUint32(22,s,true);h.setUint16(26,n.length,true);
  parts.push(h,n,f.data);
  const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,0x21,true);d.setUint32(16,c,true);d.setUint32(20,s,true);d.setUint32(24,s,true);d.setUint16(28,n.length,true);d.setUint32(42,off,true);
  cd.push(d,n);off+=30+n.length+s}
 const size=cd.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e],{type:'application/zip'})}
